# Enable 802.11 power save on Apple Broadcom (brcmfmac) Wi-Fi radios.
# Uses a named [connection-*] section keyed on driver:brcmfmac so it takes
# precedence over generic [connection] wifi.powersave=2 overrides aimed at
# x86 Wi-Fi firmware without affecting other drivers.
[connection-aurora-brcmfmac-powersave]
match-device=driver:brcmfmac
wifi.powersave=3
