# Keep the dispatcher on the bus until NetworkManager has stopped.
#
# NetworkManager dispatches dns-change and connectivity-change events while
# it stops. The dispatcher exits after 10 s idle, and once shutdown is queued
# systemd refuses to start it, so its D-Bus activation fails on every
# shutdown. NetworkManager issue 1643.
[Unit]
Before=NetworkManager.service

[Service]
ExecStart=
ExecStart=/usr/lib/nm-dispatcher --persist
