# Break the ordering cycle that stops a Plasma session.
#
# drkonqi orders this unit after the target that its default dependencies
# order it before: the cleanup timer after timers.target, the sentry path
# after default.target, which comes after paths.target. Every session stop
# then finds a cycle, and systemd deletes a stop job to break it.
#
# KDE bug 528003. Keep the default dependencies a user unit needs, without
# that implicit ordering.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
