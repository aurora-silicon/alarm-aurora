# Aurora Apple Silicon: reboot and kexec watchdog.
#
# systemd arms the hardware watchdog for the final stage of a reboot or kexec.
# The Apple SoC watchdog counts at 24 MHz in a 32-bit register, so it cannot
# time out later than about 178 s. systemd's default of 10 min is longer than
# that, so the kernel keeps feeding the watchdog itself, and a reboot that
# stalls with the kernel still running is not reset for over 10 minutes.
# 2 min is within the hardware range: the watchdog is armed for exactly that
# long and nothing feeds it once the reboot is under way.
[Manager]
RebootWatchdogSec=2min
KExecWatchdogSec=2min
