# Let the malcontent daemons stop when systemd asks.
#
# The units' system call filter lacks @signal, so GLib cannot install its
# SIGTERM handler. Each daemon runs as PID 1 of its own PID namespace
# (PrivatePIDs=yes), where an unhandled SIGTERM is dropped, so a stop waits
# for the daemon's 30 s inactivity timeout. That holds up shutdown when the
# machine reboots soon after login.
#
# @signal is upstream malcontent commit af8226a7d3c3 ("Fix system call
# filters for signal handling"), not yet in a release. After a signal the
# daemon re-raises it to exit, which a namespace init cannot do, so it exits
# with EX_OSERR (71) instead; count that as a clean stop.
[Service]
SystemCallFilter=@signal
SuccessExitStatus=71
