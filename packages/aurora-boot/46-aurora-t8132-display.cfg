# Aurora: admit the internal display on T8132 Macs.
#
# The kernel leaves the internal display DARTs that iBoot hands over live on
# T8132 untouched unless apple_dart.j713_dcp and apple_dart.j713_display are
# set. Without them the DCP has no DART domain and appledrm never binds: only
# simpledrm comes up, and the GPU, which waits for the native display, stays
# off. The kernel reads both only for those two DARTs on its T8132 firmware
# path (the M4 Airs on any firmware, the other M4 Macs on 26.6.2), so they are
# set on every Mac: an image's grub.cfg is generated away from the Mac it
# boots, where no device tree names the chip. A value already on the command
# line wins.
case " $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT " in
  *[[:space:]]apple[-_]dart.j713[-_]dcp=*) ;;
  *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }apple_dart.j713_dcp=1" ;;
esac
case " $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT " in
  *[[:space:]]apple[-_]dart.j713[-_]display=*) ;;
  *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }apple_dart.j713_display=1" ;;
esac
