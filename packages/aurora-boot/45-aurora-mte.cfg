# Aurora: MTE stays off on the M5 (T8142) until it is qualified there. The M5 Pro
# and Max (T6050) run with MTE: aura reserves the tag storage, and without that
# reservation the kernel keeps MTE off by itself.
if tr '\0' '\n' < /proc/device-tree/compatible 2>/dev/null | grep -qx 'apple,t8142'; then
  case " $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT " in
    *" arm64.nomte "*) ;;
    *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }arm64.nomte" ;;
  esac
fi
