# Aurora: on these chips MTE needs its tag storage reserved; aura marks that with
# /chosen/aurora,mte-tag-storage. Without the mark MTE stays off.
if tr '\0' '\n' < /proc/device-tree/compatible 2>/dev/null | grep -qxE 'apple,(t6050|t8142)' &&
    [ ! -e /proc/device-tree/chosen/aurora,mte-tag-storage ]; then
  case " $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT " in
    *" arm64.nomte "*) ;;
    *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }arm64.nomte" ;;
  esac
fi
