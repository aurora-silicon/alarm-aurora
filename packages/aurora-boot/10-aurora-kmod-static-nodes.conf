[Unit]
# Arch's mkinitcpio systemd hook bundles kmod-static-nodes.service and
# systemd-tmpfiles-setup-dev.service but omits
# systemd-tmpfiles-setup-dev-early.service, breaking their transitive ordering.
# Order systemd-tmpfiles-setup-dev.service directly after
# kmod-static-nodes.service so /dev/btrfs-control (and all other static device
# nodes) exist before systemd-udevd starts and runs 64-btrfs.rules.
Wants=kmod-static-nodes.service
After=kmod-static-nodes.service
