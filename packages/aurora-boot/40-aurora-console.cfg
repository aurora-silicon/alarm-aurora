# Aurora: keep the logo that aura and U-Boot leave on screen until the splash.
#
# With no GRUB_TERMINAL_OUTPUT, grub-mkconfig picks gfxterm, which sets a GOP
# mode and clears the screen even while the menu stays hidden. The firmware
# console leaves the screen alone. Arch's /etc/default/grub ships a 5 second
# menu; replace exactly that pair with a hidden one-second timeout, so Esc
# still opens the menu. Any value the owner set in /etc/default/grub wins.
[ -n "${GRUB_TERMINAL_OUTPUT-}" ] || GRUB_TERMINAL_OUTPUT=console
if [ "${GRUB_TIMEOUT_STYLE-}" = menu ] && [ "${GRUB_TIMEOUT-}" = 5 ]; then
  GRUB_TIMEOUT_STYLE=hidden
  GRUB_TIMEOUT=1
fi

# Without console=, the kernel also makes the device tree's stdout-path a
# console (the J700's DockChannel UART), and Plymouth then shows only its text
# view, the disk passphrase prompt included. The kernel keeps that console.
case " $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT " in
  *" plymouth.ignore-serial-consoles "*) ;;
  *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }plymouth.ignore-serial-consoles" ;;
esac
