# Include the geometry helper whenever Plymouth is in the initramfs.
[[ ${HOOKS@a} == *a* ]] || read -r -a HOOKS <<< "$HOOKS"
_aurora_hooks=()
for _aurora_hook in "${HOOKS[@]}"; do
  [[ $_aurora_hook == aurora-plymouth ]] && continue
  [[ $_aurora_hook == plymouth ]] && _aurora_hooks+=(aurora-plymouth)
  _aurora_hooks+=("$_aurora_hook")
done
HOOKS=("${_aurora_hooks[@]}")
unset _aurora_hook _aurora_hooks
