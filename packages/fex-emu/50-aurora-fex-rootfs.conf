# fex-emu: mount the stock FEX guest root filesystem below the Aurora Mesa
# layer, so the provider works on a fresh install.
[Unit]
Wants=usr-share-guestos-fex\x2dmesa.mount
After=usr-share-guestos-fex\x2dmesa.mount
# Up before anyone logs in, so a session's first x86 program uses it.
Before=systemd-user-sessions.service

[Service]
# FEX's global RootFS follows the provider: Aurora's Mesa while it is mounted,
# the stock image otherwise. A failure leaves FEX on the stock image.
ExecStartPost=-/usr/lib/fex-emu/aurora-fex-rootfs
ExecStopPost=-/usr/lib/fex-emu/aurora-fex-rootfs
