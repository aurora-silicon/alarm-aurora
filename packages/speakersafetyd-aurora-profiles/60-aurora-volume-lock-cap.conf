# The kernel lets only a CAP_SYS_ADMIN process take the "Speaker Volume
# Unlock" lock and renew it, as it already does for "Speaker Protection":
# access to the card's control device alone, which the seat user has, does
# not lift the speakers' safe level. speakersafetyd governs the speakers
# through that lock, so give it the capability (on kernels without the
# check it is unused). Its other privileges stay as they are.
[Service]
AmbientCapabilities=CAP_SYS_ADMIN
CapabilityBoundingSet=CAP_SYS_ADMIN
