# speakersafetyd writes /run/speakersafetyd/speakersafetyd.flag on its first
# start after boot. A later start that finds the flag is a restart within
# the same boot: the speakers may be hot, so the daemon assumes them at
# their temperature limit until its model has cooled them. systemd removes
# the RuntimeDirectory whenever the unit stops, so every restart, a crash
# included, found no flag and started cold. (RuntimeDirectoryPreserve= does
# not work here: with DynamicUser= and this unit's capability bounding set
# the preserved directory can't be set up again.)
#
# Leave a root-owned marker in /run when the daemon stops for any reason,
# and give a start that finds it the daemon's own flag back. /run is a
# tmpfs, so the first start after a reboot is still a cold one.
[Service]
ExecStartPre=+/usr/bin/sh -c 'if [ -e /run/speakersafetyd.started ]; then : > /run/speakersafetyd/speakersafetyd.flag; fi'
ExecStopPost=+/usr/bin/touch /run/speakersafetyd.started
