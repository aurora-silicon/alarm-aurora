# libfprint hides a fingerprint reader that a closed laptop lid covers, and
# follows the lid switch for that. fprintd's sandbox allows only the devices
# it names, so let it read input devices. libfprint opens only those that
# report switches, read-only.
# The SEP reader also needs its device allowance when the platform loads
# apple-sep without aurora-sep.service (for example, Omarchy).
[Service]
DeviceAllow=char-input r
DeviceAllow=/dev/sep-bio rw
