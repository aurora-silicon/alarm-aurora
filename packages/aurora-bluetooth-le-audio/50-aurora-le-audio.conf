# Vendor default; /etc/wireplumber/wireplumber.conf.d or the user's
# ~/.config/wireplumber/wireplumber.conf.d may replace bluez5.roles.
# Keep classic audio and hands-free available alongside LE unicast audio.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
}
