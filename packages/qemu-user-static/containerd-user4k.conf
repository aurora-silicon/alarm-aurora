# Run containerd, and the containers it starts, with 4 KiB user pages when the
# kernel allows it (aurora-userpages, user4k=on). Images for other
# architectures run under qemu-user through binfmt, and their libraries are
# linked for 4 KiB pages: on the 16 KiB kernel they fail with "failed to map
# segment from shared object". Native containers only change page size.
# Without userpages, or with user4k=off, containerd starts as before.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'if /usr/bin/userpages 4k /usr/bin/true 2>/dev/null; then exec /usr/bin/userpages 4k /usr/bin/containerd; else exec /usr/bin/containerd; fi'
