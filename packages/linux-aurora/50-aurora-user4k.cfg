# aurora-userpages: per-process 4K userspace pages (userpages 4k COMMAND)
# need user4k=on. To turn them off, add user4k=off to GRUB_CMDLINE_LINUX_DEFAULT
# in /etc/default/grub and run grub-mkconfig -o /boot/grub/grub.cfg.
case " $GRUB_CMDLINE_LINUX $GRUB_CMDLINE_LINUX_DEFAULT " in
  *[[:space:]]user4k=*) ;;
  *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }user4k=on" ;;
esac
