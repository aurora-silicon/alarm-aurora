name: Native ALARM packages
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package directories; empty builds all
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import json,os,subprocess
          names=sorted(p.parent.name for p in Path('packages').glob('*/PKGBUILD'))
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          before=event.get('before','')
          if (os.environ['GITHUB_EVENT_NAME']=='pull_request'
              or os.environ.get('GITHUB_REF','').startswith('refs/heads/ci/')
              or not before.strip('0')):
              before=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          requested=event.get('inputs',{}).get('packages','').split()
          if requested:
              if not set(requested)<=set(names): raise SystemExit('Unknown requested package')
              names=sorted(set(requested))
          elif os.environ['GITHUB_EVENT_NAME'] in ('push','pull_request') and before.strip('0'):
              paths=subprocess.check_output(['git','diff','--name-only',before,os.environ['GITHUB_SHA']],text=True).splitlines()
              if 'scripts/test-graphics-upgrade' in paths:
                  paths.append('packages/mesa-aurora/PKGBUILD')
              if 'sources.json' in paths:
                  previous=json.loads(subprocess.check_output(['git','show',before+':sources.json'],text=True))
                  current=json.loads(Path('sources.json').read_text())
                  changed={key for key in previous.keys()|current.keys() if previous.get(key)!=current.get(key)}
                  source_packages={name:name for name in names}
                  source_packages['kernel-aurora']='linux-aurora'
                  source_packages['alsa-utils']='alsa-utils-aurora'
                  if changed <= set(source_packages):
                      paths.remove('sources.json')
                      paths.extend('packages/'+source_packages[name]+'/PKGBUILD' for name in changed)
              core={'scripts/ci-build-package','scripts/ci-build-alarm-container','scripts/ci-build-fex-guest','scripts/fetch-base.py','images/base.json','keys/archlinuxarm-build-system.asc','sources.json'}
              if not core.intersection(paths):
                  names=sorted({p.split('/')[1] for p in paths if p.startswith('packages/') and p.split('/')[1] in names})
          print('packages='+json.dumps(names))
          PY
      - run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          for file in packages/*/PKGBUILD scripts/*; do
            [[ $file == *.py ]] || bash -n "$file"
          done
  fex-overlay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Exercise pacman upgrade with a mounted overlay
        run: |
          set -euo pipefail
          python3 scripts/fetch-base.py
          docker import cache/base/ArchLinuxARM-aarch64.tar.gz aurora-alarm-overlay
          mkdir -p "$RUNNER_TEMP/proof"
          docker run -d --name fex-overlay --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/proof:/proof" aurora-alarm-overlay /sbin/init
          trap 'docker logs fex-overlay > "$RUNNER_TEMP/proof/systemd.log" 2>&1; docker rm -f fex-overlay' EXIT
          for attempt in {1..30}; do
            if docker exec fex-overlay systemctl is-active multi-user.target; then break; fi
            sleep 1
          done
          docker exec fex-overlay bash /src/scripts/test-fex-overlay-upgrade
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fex-overlay-upgrade-proof
          path: ${{ runner.temp }}/proof/
  build:
    needs: metadata
    if: needs.metadata.outputs.packages != '[]'
    runs-on: ${{ matrix.package == 'mesa-aurora-fex-guest' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: ${{ fromJSON(needs.metadata.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build package in signed ALARM root filesystem
        if: matrix.package != 'mesa-aurora-fex-guest' && matrix.package != 'aurora-flatpak-gl'
        run: |
          set -euo pipefail
          docker run --rm --privileged -v "$PWD:/src" -w /src \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y python3 gnupg2 tar gzip util-linux coreutils
              bash scripts/ci-build-package "$1"
              if [[ $1 == mesa-aurora ]]; then
                chroot out/container /bin/bash /src/scripts/test-graphics-upgrade /tmp/package-build
              fi
            ' build '${{ matrix.package }}' 2>&1 | tee build.log
      - name: Build Flatpak GL in signed ALARM OCI root
        if: matrix.package == 'aurora-flatpak-gl'
        run: |
          set -euo pipefail
          python3 scripts/fetch-base.py
          docker import cache/base/ArchLinuxARM-aarch64.tar.gz aurora-alarm-build
          docker run --rm --privileged --security-opt apparmor=unconfined \
            -v "$PWD:/src" -w /src aurora-alarm-build \
            /bin/bash scripts/ci-build-alarm-container aurora-flatpak-gl 2>&1 | tee build.log
      - name: Build x86 FEX guest layer in Arch multilib container
        if: matrix.package == 'mesa-aurora-fex-guest'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src archlinux:base-devel \
            bash scripts/ci-build-fex-guest 2>&1 | tee build.log
      - name: Compare a failing Mutter suite with the unpatched release
        if: failure() && matrix.package == 'mutter-aurora'
        run: |
          set -euo pipefail
          docker run --rm --privileged -v "$PWD:/src" -w /src \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y util-linux coreutils
              bash scripts/test-mutter-upstream
            ' 2>&1 | tee mutter-upstream-control.log
      # Provenance for the exact package bytes; publication verifies it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: success() && github.event_name != 'pull_request'
        with:
          subject-path: out/packages/*.pkg.tar.*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: alarm-${{ matrix.package }}
          path: |
            out/packages/*.pkg.tar.*
            out/container/tmp/package-build/src/linux-*/build/base/.config
            build.log
            out/container/tmp/package-build/src/build/meson-logs/**
            out/mutter-upstream-comparison/**
            mutter-upstream-control.log
            out/graphics-upgrade/*.txt
            out/graphics-upgrade/*.sha256
            out/graphics-upgrade/*.conf
            out/graphics-upgrade/stock-packages.tar
          include-hidden-files: true
          retention-days: 30
      # A failed attempt keeps its log under a name publication never reads.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: alarm-${{ matrix.package }}-failed-attempt-${{ github.run_attempt }}
          path: |
            build.log
            out/container/tmp/package-build/src/build/meson-logs/**
            out/mutter-upstream-comparison/**
            mutter-upstream-control.log
            out/graphics-upgrade/*.txt
            out/graphics-upgrade/*.sha256
            out/graphics-upgrade/*.conf
            out/graphics-upgrade/stock-packages.tar
            out/container/tmp/package-build/src/linux-*/build/base/.config
          include-hidden-files: true
          retention-days: 14
