name: Native Aurora Alarm images
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [arch-minimal, arch-kde, arch-gnome]
        default: arch-minimal
      release-tag:
        description: Immutable signed Aurora Alarm snapshot
        required: true
      channel:
        description: Update channel the installed system follows (testing keeps today's feed URL)
        type: choice
        options: [testing, stable, edge]
        default: testing
      edge-snapshot:
        description: For edge, the signed [aurora-edge] overlay (edge-YYYYMMDD.N) the image installs ahead of release-tag
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Authenticate the Edge overlay the image installs from
        if: inputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_SNAPSHOT: ${{ inputs.edge-snapshot }}
        run: |
          set -euo pipefail
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); import edgelib; edgelib.snapshot(os.environ["EDGE_SNAPSHOT"])'
          mkdir -p out
          gh release download "$EDGE_SNAPSHOT" --repo "$GITHUB_REPOSITORY" --dir out/edge-snapshot \
            --pattern edge-sources.json --pattern 'aurora-edge.db*'
          for subject in out/edge-snapshot/edge-sources.json out/edge-snapshot/aurora-edge.db; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-edge.yml" --deny-self-hosted-runners
          done
          jq -e '.schema == 1 and .channel == "edge"' out/edge-snapshot/edge-sources.json
          echo "AURORA_EDGE_SOURCES=/src/out/edge-snapshot/edge-sources.json" >> "$GITHUB_ENV"
      - name: Build and seal the distribution image
        env:
          PROFILE: ${{ inputs.profile }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          CHANNEL: ${{ inputs.channel || 'testing' }}
          AURORA_EDGE_SNAPSHOT: ${{ inputs.channel == 'edge' && inputs.edge-snapshot || '' }}
        run: |
          set -euo pipefail
          [[ $CHANNEL != edge || -n ${AURORA_EDGE_SOURCES:-} ]] || { echo 'An Edge image needs its Edge overlay' >&2; exit 1; }
          docker run --rm --privileged --ipc=host -v /dev:/dev -v /run/udev:/run/udev:ro -v "$PWD:/src" -w /src \
            -e AURORA_EDGE_SNAPSHOT -e AURORA_EDGE_SOURCES \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y python3 gnupg2 tar gzip util-linux coreutils btrfs-progs e2fsprogs dosfstools zstd systemd-udev bsdtar
              bash scripts/build-image "$1" "$2" "$3"
            ' image "$PROFILE" "$RELEASE_TAG" "$CHANNEL" 2>&1 | tee image-build.log
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*-filesystems.tar.zst
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.channel == 'edge'
        with:
          subject-path: out/*-installer/edge-image-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ inputs.profile }}-candidate
          compression-level: 0
          path: |
            image-build.log
            out/*-filesystems.tar.zst*
            out/*-installer/image.json
            out/*-installer/edge-image-proof.json
          retention-days: 14
