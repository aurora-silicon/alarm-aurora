name: Publish signed ALARM testing snapshot
on:
  workflow_dispatch:
    inputs:
      build-run:
        description: Successful full native package build with unchanged package inputs
        required: true
      release-tag:
        description: New immutable testing snapshot tag
        required: true
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: alarm-repository-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate the complete candidate build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build-run }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          [[ $BUILD_RUN =~ ^[0-9]+$ && $RELEASE_TAG =~ ^testing-[A-Za-z0-9._-]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > build.json
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.conclusion == "success" and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/packages.yml" and (.event == "push" or .event == "workflow_dispatch")' build.json
          build_head=$(jq -r .head_sha build.json)
          [[ $build_head =~ ^[a-f0-9]{40}$ ]]
          git fetch --depth=1 origin "$build_head"
          # A publisher-only correction may reuse a fully successful build.
          # Every package recipe, source pin, build script and build workflow
          # must be byte-identical; any other difference requires a new build.
          changed=$(git diff --name-only "$build_head" "$GITHUB_SHA" -- . ':(exclude).github/workflows/publish.yml')
          [[ -z $changed ]] || { printf 'Package input changes require a new full build:\n%s\n' "$changed" >&2; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,subprocess,zipfile
          expected={'alarm-'+p.parent.name for p in Path('packages').glob('*/PKGBUILD')}
          endpoint=f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["BUILD_RUN"]}/artifacts?per_page=100'
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',endpoint]))
          artifacts=[a for page in pages for a in page['artifacts'] if a['name'] in expected]
          assert expected <= {a['name'] for a in artifacts}, 'complete recipe matrix required'
          assert sum(a['size_in_bytes'] for a in artifacts) < 1_500_000_000
          downloads=Path('downloaded'); downloads.mkdir()
          output=Path('input-packages'); output.mkdir()
          populated=set(); receipt=[]
          for artifact in artifacts:
              assert not artifact['expired'] and isinstance(artifact['id'],int)
              archive=downloads/f"{artifact['name']}-{artifact['id']}.zip"
              with archive.open('wb') as stream:
                  subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact["id"]}/zip'],stdout=stream,check=True)
              with archive.open('rb') as stream:
                  digest='sha256:'+hashlib.file_digest(stream,'sha256').hexdigest()
              assert digest == artifact['digest'], 'CI artifact digest mismatch'
              packages=[]
              with zipfile.ZipFile(archive) as entries:
                  for entry in entries.infolist():
                      name=Path(entry.filename).name
                      if not re.fullmatch(r'[A-Za-z0-9_.+:~-]+\.pkg\.tar\.(xz|zst|gz)',name): continue
                      assert not entry.is_dir() and entry.file_size < 900_000_000
                      assert (entry.external_attr >> 16) & 0o170000 != 0o120000
                      candidate=output/(name+'.incoming')
                      with entries.open(entry) as source,candidate.open('xb') as target:
                          shutil.copyfileobj(source,target)
                      destination=output/name
                      if destination.exists():
                          with candidate.open('rb') as left,destination.open('rb') as right:
                              assert hashlib.file_digest(left,'sha256').digest()==hashlib.file_digest(right,'sha256').digest(), 'conflicting duplicate package'
                          candidate.unlink()
                      else: candidate.rename(destination)
                      packages.append(name); populated.add(artifact['name'])
              receipt.append({'artifact_id':artifact['id'],'name':artifact['name'],'digest':digest,'packages':packages})
          assert expected == populated, 'a recipe has no actual package archive'
          Path('publication-inputs.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Sign the package set and pacman databases
        env:
          ALARM_SIGNING_KEY: ${{ secrets.ALARM_SIGNING_KEY }}
          ALARM_SIGNING_PASSPHRASE: ${{ secrets.ALARM_SIGNING_PASSPHRASE }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e ALARM_SIGNING_KEY -e ALARM_SIGNING_PASSPHRASE \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y pacman bsdtar gnupg2 python3
              python3 scripts/sign-repository.py --packages input-packages --output repository
            '
      - name: Return signed output ownership to the publisher
        run: sudo chown -R "$(id -u):$(id -g)" repository
      - name: Publish the immutable testing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          cp build.json publication-inputs.json repository/
          gh release create "$RELEASE_TAG" repository/* --target "$GITHUB_SHA" \
            --prerelease --title "Aurora ALARM $RELEASE_TAG" \
            --notes 'Signed native ALARM development package snapshot. Package and database signatures are verified before upload. Physical installation qualification is recorded separately.'
